name: test
on: push
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: install jupyter
        run: pip install nbformat ipykernel nbclient
      - uses: actions/checkout@v7
      - run: python -c "print('Hello!')"
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - run: quarto render article.ipynb --execute --to pdf
      
